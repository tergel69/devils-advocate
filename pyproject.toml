[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "An autonomous research agent that searches the web, reads content, synthesizes findings, and writes structured reports with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=7.0.0",
    "trafilatura>=2.0.0",
    "httpx>=0.28.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=0.3.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[project.scripts]
research-agent = "research_agent.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/research_agent/prompts.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
